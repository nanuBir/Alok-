<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0e1a2b">
<title>Admin — Alok</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./favicon-32.png">
<link rel="stylesheet" href="./style.css">
<style>body{background:var(--paper)}.bar{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:var(--paper);padding:10px 16px}.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}.tabs button{min-height:44px;padding:0 16px;border:1.5px solid var(--navy);background:none;font:600 .95rem var(--sans);cursor:pointer}.tabs button[aria-selected=true]{background:var(--navy);color:var(--paper)}
.a{max-width:860px;margin:0 auto;padding:16px}.a label{color:var(--ink)}.a input,.a select,.a textarea{border-color:var(--line);background:#fff;color:var(--ink)}
.row{background:#fff;border:1px solid var(--line);padding:12px 14px;margin-bottom:10px;display:grid;gap:4px}.row button{justify-self:start}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:12px}@media(max-width:560px){.tools{grid-template-columns:1fr}}
.pill{display:inline-block;background:var(--navy);color:var(--paper);font-size:.8rem;padding:2px 10px}.msg{padding:10px 0}.btn.red{background:#b3372a;color:#fff}.a form{grid-template-columns:1fr 1fr}@media(max-width:560px){.a form{grid-template-columns:1fr}}</style>
</head><body>
<div class="bar"><strong>Alok · Admin</strong><button class="btn ghost small" id="out" hidden>Sign out</button></div>
<main class="a" id="app"><p>Loading…</p></main>
<script src="./site-config.js"></script>
<script type="module" src="admin.js"></script>
</body></html>
